<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | الصفحة غير موجودة</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f8f8f8;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            text-align:center;
            color:#333;
        }

        .container{
            max-width:600px;
            padding:30px;
        }

        h1{
            font-size:100px;
            color:#0B5D4A;
        }

        h2{
            margin:15px 0;
        }

        p{
            margin-bottom:30px;
            color:#666;
        }

        a{
            display:inline-block;
            padding:14px 30px;
            background:#0B5D4A;
            color:#fff;
            text-decoration:none;
            border-radius:8px;
            transition:.3s;
        }

        a:hover{
            background:#084437;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>404</h1>

    <h2>عذراً، الصفحة غير موجودة</h2>

    <p>الرابط الذي تبحث عنه غير موجود أو تم نقله.</p>

    <a href="/">العودة إلى الصفحة الرئيسية</a>
</div>

</body>
</html>
